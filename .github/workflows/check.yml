# Runs the design system's rules on every pull request (and on main after a merge).
# Same command people and agents run locally: npm run check.
name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Use the npm version pinned in package.json
        run: npm install -g npm@11.6.2

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Run the design system check
        run: npm run check

      - name: Build Storybook (catches broken stories)
        run: npm run build-storybook
